server {
    listen 80;
    server_name cryo-db.biochem.wisc.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 8080 ssl;
    server_name cryo-db.biochem.wisc.edu;

    #ssl_certificate /etc/letsencrypt/live/cryo-db.biochem.wisc.edu/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/cryo-db.biochem.wisc.edu/privkey.pem;
    ssl_certificate /opt/coccinellidb/certificate/cryo-db-certificate.crt;
    ssl_certificate_key /opt/coccinellidb/certificate/cryo-db-private.key;

    location / {
        proxy_pass http://unix:/opt/coccinellidb/var/gunicorn.sock;
        # proxy_pass http://127.0.0.1:9000;
	#proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
