server {
    listen 80;
    server_name <Provide an Fully Qualified Domain Name>;
    return 301 https://$host$request_uri;
}

server {
    listen 8080 ssl;
    server_name cryo-db.biochem.wisc.edu;

    ssl_certificate <Provide a certificate.crt>;
    ssl_certificate_key <Provide a private.key>;

    location / {
        proxy_pass http://unix:/opt/coccinellidb/var/gunicorn.sock;
        # proxy_pass http://127.0.0.1:9000;
	#proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
